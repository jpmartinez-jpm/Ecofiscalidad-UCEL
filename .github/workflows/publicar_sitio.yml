name: Publicar sitio en GitHub Pages

on:
  push:
    branches: [main]
  # El robot semanal de novedades hace commits con el token de Actions, que no disparan "push";
  # por eso el sitio también se vuelve a publicar cuando ese robot termina.
  workflow_run:
    workflows: ["Relevamiento y Geolocalización Ecofiscal UCEL"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      # AI Studio usa bun y guarda bun.lock: se instala con las mismas versiones.
      - name: Configurar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalar dependencias
        run: bun install --frozen-lockfile

      - name: Compilar la app
        run: bun run build

      - name: Copiar datos públicos al sitio
        run: |
          mkdir -p dist/data
          cp data/novedades_mapa.json dist/data/novedades_mapa.json
          cp relevamiento.json dist/relevamiento.json

      - name: Subir el sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
